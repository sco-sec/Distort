[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distort"
version = "0.2.0"
description = "Deterministic password-mutation wordlist generation for authorized security auditing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sco-sec/Distort"
Repository = "https://github.com/sco-sec/Distort"
Issues = "https://github.com/sco-sec/Distort/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
distort = "distort.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
